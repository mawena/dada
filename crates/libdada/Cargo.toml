[package]
name = "libdada"
description = "Core library of the dada portable filesystem"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Test helpers (FaultyDevice) for the integration tests.
testing = []

[dependencies]
caseless = "0.2.2"
crc32c = "0.6.8"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
