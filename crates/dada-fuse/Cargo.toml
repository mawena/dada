[package]
name = "dada-fuse"
description = "FUSE adapter for dada (Linux, macOS)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "dada-fuse"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fuser = { version = "0.18.0", default-features = false, optional = true }
libdada.workspace = true
log = "0.4.34"

[features]
# The FUSE adapter. Off by default so that the workspace builds everywhere;
# on Linux it mounts through fusermount3 and needs no libfuse headers.
fuse = ["dep:fuser"]
# macOS: link against libfuse from macFUSE or FUSE-T.
macos = ["fuse", "fuser/libfuse"]
