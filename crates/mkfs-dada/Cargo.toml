[package]
name = "mkfs-dada"
description = "Format a volume with the dada filesystem"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "mkfs-dada"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libdada.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
