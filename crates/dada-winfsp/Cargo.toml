[package]
name = "dada-winfsp"
description = "WinFsp adapter for dada (Windows)"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "dada-winfsp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
libdada.workspace = true
log = "0.4.34"

[features]
# The WinFsp adapter (Windows only). Off by default so that the workspace
# builds without the WinFsp SDK.
winfsp = ["dep:winfsp", "dep:windows"]

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", optional = true, default-features = false, features = ["delayload"] }
# Same version as winfsp uses: the trait signatures name its types.
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", optional = true, default-features = false, features = ["delayload"] }
