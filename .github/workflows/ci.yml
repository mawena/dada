name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke test (mkfs-dada, dadactl)
        shell: bash
        run: |
          cargo build --workspace
          img="$RUNNER_TEMP/t.img"
          py=$(command -v python3 || command -v python)
          "$py" -c "import sys; open(sys.argv[1], 'wb').truncate(100 << 20)" "$img"
          target/debug/mkfs-dada --label TEST "$img"
          target/debug/dadactl info "$img"
          target/debug/dadactl ls "$img" /
