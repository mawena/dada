name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke test (mkfs-dada, dadactl)
        shell: bash
        run: |
          cargo build --workspace
          img="$RUNNER_TEMP/t.img"
          py=$(command -v python3 || command -v python)
          "$py" -c "import sys; open(sys.argv[1], 'wb').truncate(100 << 20)" "$img"
          target/debug/mkfs-dada --label TEST "$img"
          target/debug/dadactl info "$img"
          target/debug/dadactl ls "$img" /

  fuse-linux:
    name: FUSE (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install fuse3
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: clippy (fuse feature)
        run: cargo clippy -p dada-fuse --features fuse --all-targets -- -D warnings
      - name: test (fuse feature)
        run: cargo test -p dada-fuse --features fuse
      - name: build
        run: cargo build --release -p dada-fuse --features fuse -p mkfs-dada -p fsck-dada -p dadactl
      - name: mount test
        run: tests/fuse/run.sh

  fuse-macos:
    name: FUSE (macOS, build only)
    runs-on: macos-latest
    # macFUSE needs a kernel extension that hosted runners cannot load; only
    # the build is checked, and it does not block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install macFUSE
        run: brew install --cask macfuse
      - name: build
        run: cargo build -p dada-fuse --features macos

  winfsp:
    name: WinFsp (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install WinFsp
        run: choco install winfsp -y
      - name: clippy (winfsp feature)
        run: cargo clippy -p dada-winfsp --features winfsp --all-targets -- -D warnings
      - name: build
        run: cargo build --release -p dada-winfsp --features winfsp

  crossos-make:
    name: cross-OS image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make image
        run: cargo run --release -p dada-tests --bin dada-crossos -- make cross-${{ matrix.os }}.img
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.os }}
          path: cross-${{ matrix.os }}.img

  crossos-verify:
    name: cross-OS check (${{ matrix.os }})
    needs: crossos-make
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-*
          merge-multiple: true
      - name: read every image with libdada
        shell: bash
        run: |
          cargo build --release -p dada-tests --bin dada-crossos
          for img in cross-*.img; do
            echo "== $img"
            target/release/dada-crossos verify "$img"
          done
      - name: read every image through FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3
          cargo build --release -p dada-fuse --features fuse
          for img in cross-*.img; do
            mkdir -p "mnt-$img"
            target/release/dada-fuse -o ro "$img" "mnt-$img" &
            sleep 2
            target/release/dada-crossos verify-dir "mnt-$img"
            fusermount3 -u "mnt-$img"
          done
      - name: read every image through WinFsp
        if: runner.os == 'Windows'
        # Mounting needs the WinFsp driver on the runner: not blocking yet.
        continue-on-error: true
        shell: pwsh
        run: |
          choco install winfsp -y
          cargo build --release -p dada-winfsp --features winfsp
          New-Item -ItemType File -Force empty.txt | Out-Null
          foreach ($img in Get-ChildItem cross-*.img) {
            $p = Start-Process -FilePath target\release\dada-winfsp.exe -ArgumentList "--read-only", $img.FullName, "X:" -PassThru -RedirectStandardInput empty.txt
            Start-Sleep -Seconds 5
            target\release\dada-crossos.exe verify-dir --windows-names X:\
            Stop-Process -Id $p.Id
            Start-Sleep -Seconds 2
          }

  long-tests:
    name: long tests (ignored)
    # Several GiB of I/O: only on main and on demand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ignored tests (release)
        run: cargo test --release --workspace -- --ignored --nocapture

  fuzz:
    name: fuzz (short)
    # A few minutes per target on main and on demand; long runs are manual.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: run every target
        working-directory: fuzz
        run: |
          for t in superblock_decode inode_decode dir_block_parse open_image; do
            mkdir -p corpus/$t
            cargo fuzz run -O $t corpus/$t seeds/$t -- -max_total_time=180
          done
