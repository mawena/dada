name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke test (mkfs-dada, dadactl)
        shell: bash
        run: |
          cargo build --workspace
          img="$RUNNER_TEMP/t.img"
          py=$(command -v python3 || command -v python)
          "$py" -c "import sys; open(sys.argv[1], 'wb').truncate(100 << 20)" "$img"
          target/debug/mkfs-dada --label TEST "$img"
          target/debug/dadactl info "$img"
          target/debug/dadactl ls "$img" /

  fuse-linux:
    name: FUSE (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install fuse3
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: clippy (fuse feature)
        run: cargo clippy -p dada-fuse --features fuse --all-targets -- -D warnings
      - name: test (fuse feature)
        run: cargo test -p dada-fuse --features fuse
      - name: build
        run: cargo build --release -p dada-fuse --features fuse -p mkfs-dada -p fsck-dada -p dadactl
      - name: mount test
        run: tests/fuse/run.sh

  fuse-macos:
    name: FUSE (macOS, build only)
    runs-on: macos-latest
    # macFUSE needs a kernel extension that hosted runners cannot load; only
    # the build is checked, and it does not block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install macFUSE
        run: brew install --cask macfuse
      - name: build
        run: cargo build -p dada-fuse --features macos

  long-tests:
    name: long tests (ignored)
    # Several GiB of I/O: only on main and on demand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ignored tests (release)
        run: cargo test --release --workspace -- --ignored --nocapture
